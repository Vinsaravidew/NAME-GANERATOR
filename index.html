<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NAME GENERATOR</title>
<meta name="description" content="Create stylish names with fonts and symbols. Copy and share names with everyone.">
<style>
*{box-sizing:border-box}body{margin:0;background:#080b14;color:#f5f7ff;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif}
body:before{content:"";position:fixed;inset:0;z-index:-1;background:radial-gradient(circle at 20% 0,#35245c 0,transparent 34%),radial-gradient(circle at 90% 10%,#3a1748 0,transparent 30%)}
.wrap{max-width:1100px;margin:auto;padding:24px 14px 50px}.hero{text-align:center;padding:25px 5px}
h1{font-size:clamp(36px,8vw,68px);margin:0;font-weight:950;letter-spacing:-2px;background:linear-gradient(90deg,#fff,#c4b5fd,#f9a8d4);-webkit-background-clip:text;color:transparent}
.hero p{color:#aab2c8;margin:9px 0 0}.panel{background:#0f1422ee;border:1px solid #252d43;border-radius:24px;padding:16px;box-shadow:0 20px 80px #0009}
.controls{display:flex;gap:10px;flex-wrap:wrap}.input{flex:1;min-width:210px;padding:15px 16px;border-radius:15px;border:1px solid #6641c5;background:#090d17;color:#fff;font-size:17px;outline:0}.input:focus{border-color:#b47cff;box-shadow:0 0 0 3px #8b5cf633}
button{border:0;color:#fff;font-weight:850;cursor:pointer}.btn{padding:13px 18px;border-radius:14px;background:linear-gradient(135deg,#8b5cf6,#ec4899);font-size:15px}.ghost{background:#20283c}.tabs{display:flex;gap:8px;overflow:auto;padding:15px 0 7px}.tab{white-space:nowrap;padding:10px 15px;border-radius:999px;background:#111829;border:1px solid #283149;color:#aeb6cb}.tab.active{background:#33215c;border-color:#8655ef;color:#fff}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(255px,1fr));gap:12px;margin-top:10px}.card{background:linear-gradient(145deg,#151b2b,#0e1320);border:1px solid #242d42;border-radius:18px;padding:16px}.label{font-size:11px;letter-spacing:1.2px;color:#8f9ab1;text-transform:uppercase}.result{font-size:24px;min-height:36px;margin:13px 0;word-break:break-word}.actions{display:flex;gap:8px}.small{padding:8px 12px;border-radius:10px;font-size:13px}.section{margin-top:25px}.section h2{font-size:21px;margin:0 0 10px}.feed{display:grid;gap:9px}.feeditem{display:flex;align-items:center;gap:10px;justify-content:space-between;background:#0b101c;border:1px solid #20283b;border-radius:14px;padding:11px 13px}.feedname{font-size:19px;word-break:break-word}.meta{font-size:10px;color:#6f7990;white-space:nowrap}.empty{text-align:center;padding:22px;color:#737e96;border:1px dashed #2a3348;border-radius:14px}.status{font-size:12px;color:#7f8ba3;margin-top:8px}.symbolbar{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}.sym{background:#171e30;border:1px solid #2a344c;padding:7px 10px;border-radius:10px;color:#fff}.notice{margin-top:12px;background:#141b2a;border:1px solid #28344d;padding:10px 12px;border-radius:12px;color:#aeb7ca;font-size:12px}
@media(max-width:560px){.panel{padding:12px}.grid{grid-template-columns:1fr}.feeditem{align-items:flex-start}.meta{display:none}}
</style>
</head>
<body>
<div class="wrap">
<section class="hero"><h1>NAME GENERATOR</h1><p>Stylish fonts • Symbols • Copy • Shared names</p></section>
<section class="panel">
<div class="controls">
<input id="name" class="input" maxlength="40" placeholder="Type your name… e.g. ALVIN">
<button class="btn" onclick="generate()">Generate ✨</button>
<button class="btn ghost" onclick="randomName()">Random 🎲</button>
</div>
<div class="symbolbar" id="symbols"></div>
<div class="tabs" id="tabs"></div>
<div id="grid" class="grid"></div>
<div class="notice">🌍 <b>Live shared names:</b> when you generate a name, the generated styles are published automatically. Other visitors can see them here.</div>
<div class="section"><h2>🌍 Names made by everyone</h2><div id="feed" class="feed"><div class="empty">Loading shared names…</div></div><div id="status" class="status"></div></div>
</section>
</div>
<script>
const U="ABCDEFGHIJKLMNOPQRSTUVWXYZ",L="abcdefghijklmnopqrstuvwxyz";
const MAP={
bold:["𝐀𝐁𝐂𝐃𝐄𝐅𝐆𝐇𝐈𝐉𝐊𝐋𝐌𝐍𝐎𝐏𝐐𝐑𝐒𝐓𝐔𝐕𝐖𝐗𝐘𝐙","𝐚𝐛𝐜𝐝𝐞𝐟𝐠𝐡𝐢𝐣𝐤𝐥𝐦𝐧𝐨𝐩𝐪𝐫𝐬𝐭𝐮𝐯𝐰𝐱𝐲𝐳"],
bolditalic:["𝑨𝑩𝑪𝑫𝑬𝑭𝑮𝑯𝑰𝑱𝑲𝑳𝑴𝑵𝑶𝑷𝑸𝑹𝑺𝑻𝑼𝑽𝑾𝑿𝒀𝒁","𝒂𝒃𝒄𝒅𝒆𝒇𝒈𝒉𝒊𝒋𝒌𝒍𝒎𝒏𝒐𝒑𝒒𝒓𝒔𝒕𝒖𝒗𝒘𝒙𝒚𝒛"],
italic:["𝘈𝘉𝘊𝘋𝘌𝘍𝘎𝘏𝘐𝘑𝘒𝘓𝘔𝘕𝘖𝘗𝘘𝘙𝘚𝘛𝘜𝘝𝘞𝘟𝘠𝘡","𝘢𝘣𝘤𝘥𝘦𝘧𝘨𝘩𝘪𝘫𝘬𝘭𝘮𝘯𝘰𝘱𝘲𝘳𝘴𝘵𝘶𝘷𝘸𝘹𝘺𝘻"],
script:["𝒜ℬ𝒞𝒟ℰℱ𝒢ℋℐ𝒥𝒦ℒℳ𝒩𝒪𝒫𝒬ℛ𝒮𝒯𝒰𝒱𝒲𝒳𝒴𝒵","𝒶𝒷𝒸𝒹ℯ𝒻ℊ𝒽𝒾𝒿𝓀𝓁𝓂𝓃ℴ𝓅𝓆𝓇𝓈𝓉𝓊𝓋𝓌𝓍𝓎𝓏"],
boldscript:["𝓐𝓑𝓒𝓓𝓔𝓕𝓖𝓗𝓘𝓙𝓚𝓛𝓜𝓝𝓞𝓟𝓠𝓡𝓢𝓣𝓤𝓥𝓦𝓧𝓨𝓩","𝓪𝓫𝓬𝓭𝓮𝓯𝓰𝓱𝓲𝓳𝓴𝓵𝓶𝓷𝓸𝓹𝓺𝓻𝓼𝓽𝓾𝓿𝔀𝔁𝔂𝔃"],
double:["𝔸𝔹ℂ𝔻𝔼𝔽𝔾ℍ𝕀𝕁𝕂𝕃𝕄ℕ𝕆ℙℚℝ𝕊𝕋𝕌𝕍𝕎𝕏𝕐ℤ","𝕒𝕓𝕔𝕕𝕖𝕗𝕘𝕙𝕚𝕛𝕜𝕝𝕞𝕟𝕠𝕡𝕢𝕣𝕤𝕥𝕦𝕧𝕨𝕩𝕪𝕫"],
mono:["𝙰𝙱𝙲𝙳𝙴𝙵𝙶𝙷𝙸𝙹𝙺𝙻𝙼𝙽𝙾𝙿𝚀𝚁𝚂𝚃𝚄𝚅𝚆𝚇𝚈𝚉","𝚊𝚋𝚌𝚍𝚎𝚏𝚐𝚑𝚒𝚓𝚔𝚕𝚖𝚗𝚘𝚙𝚚𝚛𝚜𝚝𝚞𝚟𝚠𝚡𝚢𝚣"],
small:["ABCDEFGHIJKLMNOPQRSTUVWXYZ","ᴀʙᴄᴅᴇꜰɢʜɪᴊᴋʟᴍɴᴏᴘǫʀsᴛᴜᴠᴡxʏᴢ"],
gothic:["𝔄𝔅ℭ𝔇𝔈𝔉𝔊ℌℑ𝔍𝔎𝔏𝔐𝔑𝔒𝔓𝔔ℜ𝔖𝔗𝔘𝔙𝔚𝔛𝔜ℨ","𝔞𝔟𝔠𝔡𝔢𝔣𝔤𝔥𝔦𝔧𝔨𝔩𝔪𝔫𝔬𝔭𝔮𝔯𝔰𝔱𝔲𝔳𝔴𝔵𝔶𝔷"],
boldgothic:["𝕬𝕭𝕮𝕯𝕰𝕱𝕲𝕳𝕴𝕵𝕶𝕷𝕸𝕹𝕺𝕻𝕼𝕽𝕾𝕿𝖀𝖁𝖂𝖃𝖄𝖅","𝖆𝖇𝖈𝖉𝖊𝖋𝖌𝖍𝖎𝖏𝖐𝖑𝖒𝖓𝖔𝖕𝖖𝖗𝖘𝖙𝖚𝖛𝖜𝖝𝖞𝖟"],
fraktur:["𝔄𝔅ℭ𝔇𝔈𝔉𝔊ℌℑ𝔍𝔎𝔏𝔐𝔑𝔒𝔓𝔔ℜ𝔖𝔗𝔘𝔙𝔚𝔛𝔜ℨ","𝔞𝔟𝔠𝔡𝔢𝔣𝔤𝔥𝔦𝔧𝔨𝔩𝔪𝔫𝔬𝔭𝔮𝔯𝔰𝔱𝔲𝔳𝔴𝔵𝔶𝔷"]
};
const styles=[
["Bold","gaming","bold"],["Bold Italic","gaming","bolditalic"],["Italic","all","italic"],["Script","cute","script"],["Bold Script","royal","boldscript"],["Double Line","royal","double"],["Monospace","gaming","mono"],["Small Caps","all","small"],["Gothic","dark","gothic"],["Bold Gothic","dark","boldgothic"],["Fraktur","dark","fraktur"],
["Circled","cute","circled"],["Squared","gaming","squared"],["Fullwidth","all","full"],["Flowers","symbols","flowers"],["Stars","symbols","stars"],["Brackets","symbols","brackets"],["Royal","royal","royal"]
];
const deco={
flowers:["❀ NAME ❀","❁ NAME ❁","✿ NAME ✿","❃ NAME ❃","✾ NAME ✾","ꕤ NAME ꕤ","ꕥ NAME ꕥ","𓆸 NAME 𓆸","⚘ NAME ⚘","🌸 NAME 🌸","🪻 NAME 🪻"],
stars:["✦ NAME ✦","✧ NAME ✧","★ NAME ★","☆ NAME ☆","✩ NAME ✩","⟡ NAME ⟡","亗 NAME 亗"],
brackets:["『NAME』","【NAME】","꧁NAME꧂","༺NAME༻","乂NAME乂","〆NAME〆","〈NAME〉","《NAME》"],
royal:["♛ NAME ♛","♕ NAME ♕","༒ NAME ༒","👑 NAME 👑","亗 NAME 亗"]
};
const cats=["all","gaming","cute","dark","royal","symbols"];
let cat="all", lastResults=[];
const cp=Array.from;
function conv(s,type){
 if(!MAP[type]) return s;
 const a=cp(MAP[type][0]),b=cp(MAP[type][1]); let o="";
 for(const ch of s){const i=U.indexOf(ch.toUpperCase());if(i<0)o+=ch;else o+=ch===ch.toUpperCase()?a[i]:b[i]}
 return o;
}
function circled(s){return cp(s).map(ch=>{let i=U.indexOf(ch.toUpperCase());return i>=0?(ch===ch.toUpperCase()?String.fromCodePoint(0x24B6+i):String.fromCodePoint(0x24D0+i)):ch}).join("")}
function full(s){return cp(s).map(ch=>{let n=ch.charCodeAt(0);return n>=33&&n<=126?String.fromCharCode(n+0xFEE0):ch}).join("")}
function make(s,type){
 if(["flowers","stars","brackets","royal"].includes(type))return deco[type][Math.floor(Math.random()*deco[type].length)].replace("NAME",conv(s,"bold"));
 if(type==="circled")return circled(s); if(type==="squared")return cp(s).map(ch=>{let i=U.indexOf(ch.toUpperCase());return i>=0?String.fromCodePoint(0x1F130+i):ch}).join("");
 if(type==="full")return full(s); return conv(s,type);
}
function esc(s){return s.replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;")}
function renderTabs(){document.getElementById("tabs").innerHTML=cats.map(x=>`<button class="tab ${x===cat?"active":""}" onclick="setCat('${x}')">${x[0].toUpperCase()+x.slice(1)}</button>`).join("")}
function renderSymbols(){let sy=["❀","❁","✿","❃","✾","ꕤ","ꕥ","𓆸","⚘","✦","✧","★","☆","亗","乂","〆","꧁","꧂","༺","༻","♡","♥","ღ","ෆ","୨୧","𓆩♡𓆪"];document.getElementById("symbols").innerHTML=sy.map(x=>`<button class="sym" onclick="insertSymbol('${x}')">${x}</button>`).join("")}
function insertSymbol(x){let e=document.getElementById("name"),p=e.selectionStart??e.value.length;e.value=e.value.slice(0,p)+x+e.value.slice(p);e.focus();e.selectionStart=e.selectionEnd=p+x.length}
function setCat(x){cat=x;renderTabs();generate(false)}
async function generate(publish=true){
 let raw=document.getElementById("name").value.trim()||"ALVIN";
 lastResults=styles.filter(s=>cat==="all"||s[1]===cat).map(s=>({style:s[0],value:make(raw,s[2])}));
 document.getElementById("grid").innerHTML=lastResults.map((x,i)=>`<div class="card"><div class="label">${esc(x.style)}</div><div class="result">${esc(x.value)}</div><div class="actions"><button class="btn small" onclick="copyText(${JSON.stringify(x.value)})">Copy</button><button class="btn ghost small" onclick="publishOne(${i})">🌍 Share</button></div></div>`).join("");
 if(publish) await publishAll(raw);
}
async function publishOne(i){if(lastResults[i]){await postName(lastResults[i].value,lastResults[i].style);loadFeed()}}
async function publishAll(raw){
 // Publish the exact styles currently shown, including symbols/fonts.
 const arr=lastResults.slice(0,40);
 for(const x of arr) await postName(x.value,x.style,raw);
 loadFeed();
}
async function postName(value,style,base){
 try{await fetch("/api/names",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({name:value,style,base:base||document.getElementById("name").value.trim()})})}
 catch(e){document.getElementById("status").textContent="Offline/local mode — shared server not connected."}
}
async function loadFeed(){
 try{let r=await fetch("/api/names?limit=100");if(!r.ok)throw 0;let data=await r.json();document.getElementById("feed").innerHTML=data.length?data.map(x=>`<div class="feeditem"><div><div class="feedname">${esc(x.name)}</div><div class="meta">${esc(x.style)} • ${new Date(x.createdAt).toLocaleString()}</div></div><button class="btn small" onclick="copyText(${JSON.stringify(x.name)})">Copy</button></div>`).join(""):`<div class="empty">No shared names yet.</div>`;document.getElementById("status").textContent="🟢 Live • updates every 3 seconds"}catch(e){document.getElementById("feed").innerHTML='<div class="empty">Open this site through the server to use global shared names.</div>';document.getElementById("status").textContent="Server connection unavailable."}
}
async function copyText(s){try{await navigator.clipboard.writeText(s);alert("Copied ✓")}catch(e){prompt("Copy this name:",s)}}
function randomName(){let a=["ALVIN","SHAGGY","VEX","NOVA","PHANTOM","VENOM","RAZE","ZENO","REAPER","BLAZE","NOX","GHOST"];document.getElementById("name").value=a[Math.floor(Math.random()*a.length)];generate()}
renderTabs();renderSymbols();generate(false);loadFeed();setInterval(loadFeed,3000);
</script>
</body></html>
